kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clickhouse-hierarchical-federation-demo-tcaas-a
nodes:
  - role: control-plane
    extraPortMappings:
      # cust1 (customer ClickHouse, tenant1)
      - containerPort: 30811
        hostPort: 8811
        protocol: TCP
      - containerPort: 30911
        hostPort: 9811
        protocol: TCP
      # cust2 (customer ClickHouse, tenant2)
      - containerPort: 30812
        hostPort: 8812
        protocol: TCP
      - containerPort: 30912
        hostPort: 9812
        protocol: TCP
      # federal router (federation entry point of this T-CaaS cluster)
      - containerPort: 30815
        hostPort: 8815
        protocol: TCP
      - containerPort: 30915
        hostPort: 9815
        protocol: TCP
